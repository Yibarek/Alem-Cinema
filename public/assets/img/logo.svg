<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cinema Reel & Clapper Emblem -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Reel Outer Ring -->
    <circle cx="24" cy="24" r="22" stroke="url(#goldGrad)" stroke-width="3.5" fill="#121620"/>
    <!-- Reel Inner Circle -->
    <circle cx="24" cy="24" r="8" fill="url(#rubyGrad)"/>
    <circle cx="24" cy="24" r="3" fill="#FDE68A"/>
    <!-- Reel Holes -->
    <circle cx="24" cy="11" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="24" cy="37" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="11" cy="24" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="37" cy="24" r="3.5" fill="url(#goldGrad)"/>
    <!-- Film Perforations accents -->
    <path d="M4 18 Q 24 2 44 18" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 14)">
    <!-- Main Title -->
    <text x="0" y="22" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="23" font-weight="900" letter-spacing="2.5" fill="url(#goldGrad)">
      ALEM
    </text>
    <text x="74" y="22" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="23" font-weight="400" letter-spacing="3" fill="#FFFFFF">
      CINEMA
    </text>
    <!-- Subtitle / Tagline -->
    <text x="1" y="34" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="600" letter-spacing="4" fill="#94A3B8">
      PREMIUM THEATRE EXPERIENCE
    </text>
    <!-- Gold accent line -->
    <line x1="1" y1="38" x2="160" y2="38" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  </g>
</svg>
