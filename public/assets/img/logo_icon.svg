    <circle cx="24" cy="24" r="8" fill="url(#rubyGradIcon)"/>
    <circle cx="24" cy="24" r="3" fill="#FDE68A"/>
    <circle cx="24" cy="11" r="3.5" fill="url(#goldGradIcon)"/>
    <circle cx="24" cy="37" r="3.5" fill="url(#goldGradIcon)"/>
    <circle cx="11" cy="24" r="3.5" fill="url(#goldGradIcon)"/>
